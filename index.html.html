<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CapCut / VN HUD Quick Editor for Meta Ray-Ban Display</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons for HUD Graphics -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    /* Absolute reset for MRBD HUD (Fixed 600x600 Display) */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 
      Additive Display Engine Rule:
      Pitch Black (#000000) renders as 100% Optical Transparency on the right lens.
    */
    body, html {
      width: 600px;
      height: 600px;
      background-color: #000000 !important;
      color: #FFFFFF;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Viewport Frame Lock */
    #mrbd-viewport {
      width: 600px;
      height: 600px;
      position: absolute;
      top: 0;
      left: 0;
      background-color: #000000;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px;
    }

    /* High Contrast Custom Focus Outline for Touchpad Items */
    .hud-focus {
      outline: 2px solid #00E5FF !important;
      outline-offset: 2px;
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.6);
    }

    .hud-card {
      background: rgba(12, 12, 12, 0.95);
      border: 1px solid #222222;
      border-radius: 12px;
    }

    /* CSS Filters for Media Editing Simulations */
    .filter-none { filter: none; }
    .filter-cinematic { filter: contrast(135%) brightness(95%) sepia(20%) saturate(120%); }
    .filter-vivid { filter: saturate(210%) contrast(115%) brightness(105%); }
    .filter-bw { filter: grayscale(100%) contrast(190%) brightness(90%); }
    .filter-cyber { filter: hue-rotate(170deg) saturate(200%) contrast(130%); }
    .filter-vintage { filter: sepia(65%) hue-rotate(-25deg) saturate(140%) contrast(110%); }
    .filter-warm { filter: sepia(35%) saturate(160%) brightness(105%) hue-rotate(-10deg); }

    /* Animated Scanlines for HUD Visual Depth */
    .hud-grid-overlay {
      background-image: linear-gradient(rgba(0, 229, 255, 0.05) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(0, 229, 255, 0.05) 1px, transparent 1px);
      background-size: 20px 20px;
    }

    /* Pulse Glow Animation */
    @keyframes pulse-glow {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px #00FF66); }
      50% { opacity: 0.6; filter: drop-shadow(0 0 2px #00FF66); }
    }
    .recording-pulse {
      animation: pulse-glow 1.5s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <div id="mrbd-viewport" class="hud-grid-overlay">

    <!-- HUD Header Bar -->
    <header class="flex justify-between items-center border-b-2 border-zinc-800 pb-2.5">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-clapperboard text-cyan-400 text-xl"></i>
        <span class="font-extrabold text-lg tracking-wider text-cyan-400 uppercase">CapCut <span class="text-xs px-1.5 py-0.5 rounded bg-cyan-950 text-cyan-300 border border-cyan-500/40">HUD</span></span>
      </div>
      
      <!-- Media Type Switcher & Recording Indicator -->
      <div class="flex items-center gap-3">
        <div id="rec-indicator" class="hidden items-center gap-1.5 text-xs text-red-500 font-bold bg-black px-2 py-0.5 rounded border border-red-800">
          <span class="w-2 h-2 rounded-full bg-red-500 recording-pulse"></span> REC 00:04
        </div>
        <button id="media-mode-toggle" class="text-xs font-bold px-2.5 py-1 rounded-full border border-emerald-400 text-emerald-400 bg-black flex items-center gap-1.5 transition-all">
          <i id="media-icon" class="fa-solid fa-camera"></i>
          <span id="media-label">PHOTO (4K)</span>
        </button>
      </div>
    </header>

    <!-- Center 600x600 Preview Area -->
    <div class="relative w-[340px] h-[320px] mx-auto my-1 flex items-center justify-center rounded-2xl border-2 border-zinc-700 bg-black overflow-hidden shadow-2xl">
      
      <!-- Reticle / Rule of Thirds HUD Overlay -->
      <div class="absolute inset-0 border border-cyan-500/10 pointer-events-none grid grid-cols-3 grid-rows-3 z-20">
        <div class="border-r border-b border-cyan-500/10"></div>
        <div class="border-r border-b border-cyan-500/10"></div>
        <div class="border-b border-cyan-500/10"></div>
        <div class="border-r border-b border-cyan-500/10"></div>
        <div class="border-r border-b border-cyan-500/10"></div>
        <div class="border-b border-cyan-500/10"></div>
        <div class="border-r border-cyan-500/10"></div>
        <div class="border-r border-cyan-500/10"></div>
        <div></div>
      </div>

      <!-- Live Simulated Media Container -->
      <div id="preview-canvas" class="w-full h-full bg-gradient-to-tr from-indigo-900 via-rose-800 to-amber-500 flex flex-col items-center justify-center transition-all duration-300 relative filter-cinematic" style="transform: scale(1);">
        <i id="preview-center-icon" class="fa-solid fa-image text-5xl text-white/80 drop-shadow-lg transition-all"></i>
        <div id="video-wave" class="hidden mt-3 flex items-end gap-1 h-5">
          <div class="w-1 bg-emerald-400 h-3 animate-bounce"></div>
          <div class="w-1 bg-emerald-400 h-5 animate-bounce [animation-delay:0.2s]"></div>
          <div class="w-1 bg-emerald-400 h-2 animate-bounce [animation-delay:0.4s]"></div>
          <div class="w-1 bg-emerald-400 h-4 animate-bounce [animation-delay:0.1s]"></div>
        </div>
      </div>

      <!-- HUD Focal Target Lock Icon -->
      <div class="absolute inset-0 flex items-center justify-center pointer-events-none z-20 opacity-40">
        <div class="w-12 h-12 border border-cyan-400 rounded-full flex items-center justify-center">
          <div class="w-1.5 h-1.5 bg-cyan-400 rounded-full"></div>
        </div>
      </div>
    </div>

    <!-- Interactive Editing Telemetry Dashboard -->
    <div class="grid grid-cols-3 gap-2.5 my-1">
      
      <!-- Filter Selector Card -->
      <div id="card-filter" class="hud-card p-2.5 transition-all hud-focus" tabIndex="0">
        <div class="text-[10px] uppercase font-bold text-zinc-400 tracking-wider flex justify-between">
          <span>Filter</span>
          <i class="fa-solid fa-wand-magic-sparkles text-cyan-400"></i>
        </div>
        <div id="val-filter" class="text-sm font-extrabold text-cyan-300 mt-0.5 truncate">Cinematic</div>
        <div class="text-[9px] text-zinc-500 mt-0.5">↔ Swipe to cycle</div>
      </div>

      <!-- Crop/Aspect Ratio Card -->
      <div id="card-crop" class="hud-card p-2.5 transition-all" tabIndex="0">
        <div class="text-[10px] uppercase font-bold text-zinc-400 tracking-wider flex justify-between">
          <span>Aspect</span>
          <i class="fa-solid fa-crop-simple text-amber-400"></i>
        </div>
        <div id="val-crop" class="text-sm font-extrabold text-amber-300 mt-0.5 truncate">1:1 Square</div>
        <div class="text-[9px] text-zinc-500 mt-0.5">↕ Swipe to crop</div>
      </div>

      <!-- Exposure Slider/Meter Card -->
      <div id="card-exposure" class="hud-card p-2.5 transition-all" tabIndex="0">
        <div class="text-[10px] uppercase font-bold text-zinc-400 tracking-wider flex justify-between">
          <span>Exposure</span>
          <i class="fa-solid fa-sun text-emerald-400"></i>
        </div>
        <div class="flex items-center gap-1.5 mt-1">
          <div class="w-full bg-zinc-800 h-2 rounded-full overflow-hidden border border-zinc-700">
            <div id="exposure-bar" class="bg-emerald-400 h-full transition-all duration-200" style="width: 50%;"></div>
          </div>
          <span id="val-exposure" class="text-xs font-bold text-emerald-300">0.0</span>
        </div>
        <div class="text-[9px] text-zinc-500 mt-0.5">Adjust step</div>
      </div>
    </div>

    <!-- Ray-Ban Touchpad & Neural Band Gesture Quick Guide -->
    <footer class="bg-zinc-950 border border-zinc-800 rounded-xl p-2 flex justify-between items-center text-[11px] text-zinc-400">
      <div class="flex items-center gap-1"><span class="text-cyan-400 font-bold">↔ Swipe:</span> Options</div>
      <div class="flex items-center gap-1"><span class="text-amber-400 font-bold">↕ Swipe:</span> Select Card</div>
      <div class="flex items-center gap-1"><span class="text-emerald-400 font-bold">● Tap:</span> Render & Export</div>
    </footer>

  </div>

  <!-- Export Processing Modal HUD Overlay -->
  <div id="export-modal" class="absolute inset-0 bg-black/95 z-50 hidden flex-col items-center justify-center p-6 text-center">
    <div class="w-16 h-16 border-4 border-zinc-800 border-t-cyan-400 rounded-full animate-spin mb-4"></div>
    <div id="export-title" class="text-2xl font-black text-cyan-400 tracking-wide uppercase">Applying VN Presets...</div>
    <div id="export-sub" class="text-xs text-zinc-400 mt-2">Encoding 4K HDR & Syncing to Meta View App</div>
    
    <!-- Render Progress Bar -->
    <div class="w-64 bg-zinc-900 border border-zinc-700 h-3 rounded-full mt-6 overflow-hidden p-0.5">
      <div id="render-progress" class="bg-gradient-to-r from-cyan-400 to-emerald-400 h-full rounded-full transition-all duration-200" style="width: 0%;"></div>
    </div>
    <div id="render-percent" class="text-xs font-mono text-emerald-400 mt-2">0%</div>
  </div>

  <script>
    // App State Management
    const filters = [
      { name: 'Cinematic', class: 'filter-cinematic' },
      { name: 'Vivid Pop', class: 'filter-vivid' },
      { name: 'B&W Film', class: 'filter-bw' },
      { name: 'Cyberpunk', class: 'filter-cyber' },
      { name: 'Vintage 90s', class: 'filter-vintage' },
      { name: 'Warm Sunset', class: 'filter-warm' },
      { name: 'Normal', class: 'filter-none' }
    ];

    const crops = [
      { name: '1:1 Square', transform: 'scale(1)' },
      { name: '9:16 Story', transform: 'scaleX(0.7) scaleY(1.15)' },
      { name: '16:9 Cinema', transform: 'scaleX(1.15) scaleY(0.7)' },
      { name: '4:5 Portrait', transform: 'scaleX(0.85) scaleY(1.05)' }
    ];

    const exposureSteps = [-2.0, -1.5, -1.0, -0.5, 0.0, 0.5, 1.0, 1.5, 2.0];

    // State Tracking Indexes
    let currentFocusCard = 0; // 0 = Filter, 1 = Crop, 2 = Exposure
    let currentFilterIdx = 0;
    let currentCropIdx = 0;
    let currentExposureIdx = 4; // Default 0.0
    let isVideoMode = false;
    let isExporting = false;

    // DOM Elements
    const cardFilter = document.getElementById('card-filter');
    const cardCrop = document.getElementById('card-crop');
    const cardExposure = document.getElementById('card-exposure');
    const cards = [cardFilter, cardCrop, cardExposure];

    const valFilter = document.getElementById('val-filter');
    const valCrop = document.getElementById('val-crop');
    const valExposure = document.getElementById('val-exposure');
    const exposureBar = document.getElementById('exposure-bar');

    const previewCanvas = document.getElementById('preview-canvas');
    const previewCenterIcon = document.getElementById('preview-center-icon');
    const videoWave = document.getElementById('video-wave');
    const mediaModeToggle = document.getElementById('media-mode-toggle');
    const mediaIcon = document.getElementById('media-icon');
    const mediaLabel = document.getElementById('media-label');
    const recIndicator = document.getElementById('rec-indicator');

    const exportModal = document.getElementById('export-modal');
    const exportTitle = document.getElementById('export-title');
    const exportSub = document.getElementById('export-sub');
    const renderProgress = document.getElementById('render-progress');
    const renderPercent = document.getElementById('render-percent');

    // Focus State Synchronizer
    function updateFocusState() {
      cards.forEach((card, idx) => {
        if (idx === currentFocusCard) {
          card.classList.add('hud-focus');
        } else {
          card.classList.remove('hud-focus');
        }
      });
    }

    // Filter Application
    function updateFilter() {
      const selected = filters[currentFilterIdx];
      // Reset filter classes and apply current
      previewCanvas.className = `w-full h-full bg-gradient-to-tr from-indigo-900 via-rose-800 to-amber-500 flex flex-col items-center justify-center transition-all duration-300 relative ${selected.class}`;
      valFilter.textContent = selected.name;
    }

    // Crop Application
    function updateCrop() {
      const selected = crops[currentCropIdx];
      previewCanvas.style.transform = selected.transform;
      valCrop.textContent = selected.name;
    }

    // Exposure Application
    function updateExposure() {
      const val = exposureSteps[currentExposureIdx];
      valExposure.textContent = (val > 0 ? '+' : '') + val.toFixed(1);
      
      // Calculate brightness % for preview simulation
      const brightnessValue = 100 + (val * 25);
      previewCanvas.style.filter += ` brightness(${brightnessValue}%)`;
      
      // Update UI bar (0 to 100%)
      const barPercent = ((currentExposureIdx) / (exposureSteps.length - 1)) * 100;
      exposureBar.style.width = `${barPercent}%`;
    }

    // Toggle Photo vs Video Mode
    function toggleMediaMode() {
      isVideoMode = !isVideoMode;
      if (isVideoMode) {
        mediaIcon.className = "fa-solid fa-video text-red-400";
        mediaLabel.textContent = "VIDEO (60fps)";
        mediaModeToggle.className = "text-xs font-bold px-2.5 py-1 rounded-full border border-red-500 text-red-400 bg-black flex items-center gap-1.5 transition-all";
        previewCenterIcon.className = "fa-solid fa-film text-5xl text-white/80 drop-shadow-lg transition-all";
        videoWave.classList.remove('hidden');
        recIndicator.classList.remove('hidden');
        recIndicator.classList.add('flex');
      } else {
        mediaIcon.className = "fa-solid fa-camera text-emerald-400";
        mediaLabel.textContent = "PHOTO (4K)";
        mediaModeToggle.className = "text-xs font-bold px-2.5 py-1 rounded-full border border-emerald-400 text-emerald-400 bg-black flex items-center gap-1.5 transition-all";
        previewCenterIcon.className = "fa-solid fa-image text-5xl text-white/80 drop-shadow-lg transition-all";
        videoWave.classList.add('hidden');
        recIndicator.classList.add('hidden');
        recIndicator.classList.remove('flex');
      }
    }

    // Export Simulation Pipeline
    function triggerExportPipeline() {
      if (isExporting) return;
      isExporting = true;

      exportModal.classList.remove('hidden');
      exportModal.classList.add('flex');
      exportTitle.textContent = isVideoMode ? "Rendering 60FPS Video..." : "Exporting 4K Photo...";
      exportSub.textContent = "Applying VN LUTs & Syncing to Phone Gallery";

      let progress = 0;
      renderProgress.style.width = '0%';
      renderPercent.textContent = '0%';

      const interval = setInterval(() => {
        progress += Math.floor(Math.random() * 20) + 15;
        if (progress >= 100) {
          progress = 100;
          clearInterval(interval);
          
          exportTitle.textContent = "Saved to Gallery! ✨";
          exportSub.textContent = "Media successfully synced to your phone";
          renderProgress.style.width = '100%';
          renderPercent.textContent = '100%';

          setTimeout(() => {
            exportModal.classList.add('hidden');
            exportModal.classList.remove('flex');
            isExporting = false;
          }, 1200);
        } else {
          renderProgress.style.width = `${progress}%`;
          renderPercent.textContent = `${progress}%`;
        }
      }, 250);
    }

    // Touchpad Gesture Mapping (Keyboard Fallbacks for Web Preview)
    document.addEventListener('keydown', (e) => {
      if (isExporting) return;

      switch (e.key) {
        // Vertical Swipe (Arrow Up / Down) -> Navigation between Editing Cards
        case 'ArrowDown':
          currentFocusCard = (currentFocusCard + 1) % cards.length;
          updateFocusState();
          break;
        case 'ArrowUp':
          currentFocusCard = (currentFocusCard - 1 + cards.length) % cards.length;
          updateFocusState();
          break;

        // Horizontal Swipe (Arrow Left / Right) -> Adjust Focused Parameter
        case 'ArrowRight':
          if (currentFocusCard === 0) {
            currentFilterIdx = (currentFilterIdx + 1) % filters.length;
            updateFilter();
          } else if (currentFocusCard === 1) {
            currentCropIdx = (currentCropIdx + 1) % crops.length;
            updateCrop();
          } else if (currentFocusCard === 2) {
            if (currentExposureIdx < exposureSteps.length - 1) {
              currentExposureIdx++;
              updateExposure();
            }
          }
          break;

        case 'ArrowLeft':
          if (currentFocusCard === 0) {
            currentFilterIdx = (currentFilterIdx - 1 + filters.length) % filters.length;
            updateFilter();
          } else if (currentFocusCard === 1) {
            currentCropIdx = (currentCropIdx - 1 + crops.length) % crops.length;
            updateCrop();
          } else if (currentFocusCard === 2) {
            if (currentExposureIdx > 0) {
              currentExposureIdx--;
              updateExposure();
            }
          }
          break;

        // Mode Toggle Key Shortcut (Key 'm' or 'M')
        case 'm':
        case 'M':
          toggleMediaMode();
          break;

        // Tap Action (Enter or Space) -> Trigger Export
        case 'Enter':
        case ' ':
          triggerExportPipeline();
          break;
      }
    });

    // Make mode toggle button clickable for direct browser preview
    mediaModeToggle.addEventListener('click', toggleMediaMode);

    // Initial Setup
    updateFocusState();
    updateFilter();
    updateCrop();
    updateExposure();
  </script>
</body>
</html>
